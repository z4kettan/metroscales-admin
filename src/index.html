<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Metro Scales Admin</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Manage Metro Scales customers, their logins and their scales." />
    <meta name="theme-color" content="#f7faf8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MS Admin" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..500,0..1,0&display=block" rel="stylesheet" />
    <script>
      // Apply the saved theme before the app loads, so there is no flash
      (function () {
        var mode = 'system';
        try { mode = localStorage.getItem('ms_theme') || 'system'; } catch (e) {}
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        document.querySelector('meta[name=theme-color]').setAttribute('content', dark ? '#101414' : '#f7faf8');
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please turn on JavaScript to use Metro Scales Admin.</noscript>
  </body>
</html>
